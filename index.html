<script>
'use strict';
console.log("Hi, I'm Pinxu 🖤");

/* ═══════════════════════════════════════════════════════════════════
   TRIANGLE TEXTURE MAPPING — affine warp for each mesh quad
═══════════════════════════════════════════════════════════════════ */

function drawTriTex(ctx, img,
  sx0,sy0, sx1,sy1, sx2,sy2,
  dx0,dy0, dx1,dy1, dx2,dy2
) {
  var sx01=sx1-sx0, sy01=sy1-sy0, sx02=sx2-sx0, sy02=sy2-sy0;
  var dx01=dx1-dx0, dy01=dy1-dy0, dx02=dx2-dx0, dy02=dy2-dy0;
  var det = sx01*sy02 - sy01*sx02;
  if (Math.abs(det) < 0.01) return;
  var a=(dx01*sy02-dx02*sy01)/det, b=(dy01*sy02-dy02*sy01)/det;
  var c=(dx02*sx01-dx01*sx02)/det, d=(dy02*sx01-dy01*sx02)/det;
  var e=dx0-a*sx0-c*sy0,          f=dy0-b*sx0-d*sy0;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(dx0,dy0); ctx.lineTo(dx1,dy1); ctx.lineTo(dx2,dy2);
  ctx.closePath(); ctx.clip();
  ctx.transform(a,b,c,d,e,f);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   VERLET MESH — soft-body grid for image warping
═══════════════════════════════════════════════════════════════════ */

var GCOLS = 10, GROWS = 10;
var MESH_DAMP = 0.80;   // high = sluggish jelly
var MESH_PULL = 0.052;  // interior anchor
var EDGE_PULL = 0.24;   // edges stay put more firmly

function MeshBody(cx, cy, dw, dh) {
  this.cx = cx; this.cy = cy;
  this.dw = dw; this.dh = dh;
  this.x0 = cx - dw/2; this.y0 = cy - dh/2;
  this.pts  = [];
  this.rest = [];
  for (var r = 0; r <= GROWS; r++) {
    for (var c = 0; c <= GCOLS; c++) {
      var x = this.x0 + (c/GCOLS)*dw;
      var y = this.y0 + (r/GROWS)*dh;
      this.pts.push({x:x, y:y, ox:x, oy:y});
      this.rest.push({x:x, y:y});
    }
  }
}
MeshBody.prototype._idx = function(r,c){ return r*(GCOLS+1)+c; };
MeshBody.prototype.update = function() {
  for (var i=0; i<this.pts.length; i++) {
    var p=this.pts[i], r=this.rest[i];
    var vx=(p.x-p.ox)*MESH_DAMP, vy=(p.y-p.oy)*MESH_DAMP;
    p.ox=p.x; p.oy=p.y;
    p.x+=vx; p.y+=vy;
    var ri=Math.floor(i/(GCOLS+1)), ci=i%(GCOLS+1);
    var edge=ri===0||ri===GROWS||ci===0||ci===GCOLS;
    var pull=edge?EDGE_PULL:MESH_PULL;
    p.x+=(r.x-p.x)*pull; p.y+=(r.y-p.y)*pull;
  }
};
MeshBody.prototype.squishAt = function(px, py, radius, strength) {
  for (var i=0; i<this.pts.length; i++) {
    var p=this.pts[i];
    var dx=p.x-px, dy=p.y-py, d=Math.hypot(dx,dy);
    if (d<radius&&d>1e-3) { var f=(1-d/radius)*strength; p.ox-=(dx/d)*f; p.oy-=(dy/d)*f; }
  }
};
MeshBody.prototype.getZone = function(px, py) {
  var nx=(px-this.cx)/(this.dw*0.5), ny=(py-this.cy)/(this.dh*0.5);
  if (Math.hypot(nx,ny)>1.14) return 'outside';
  if (ny<-0.28)                                       return 'head';
  if (ny>-0.05&&ny<0.42&&Math.abs(nx)<0.70)          return 'belly';
  if (ny<0.12&&Math.abs(nx)>0.36)                    return 'cheek';
  if (ny>0.52)                                        return 'paws';
  return 'body';
};
MeshBody.prototype.draw = function(ctx, img, breathScale) {
  var sw = img.width  / GCOLS;
  var sh = img.height / GROWS;
  ctx.save();
  ctx.translate(this.cx, this.cy);
  ctx.scale(1, breathScale);
  ctx.translate(-this.cx, -this.cy);
  for (var r=0; r<GROWS; r++) {
    for (var c=0; c<GCOLS; c++) {
      var sx0=c*sw, sy0=r*sh, sx1=(c+1)*sw, sy1=(r+1)*sh;
      var p00=this.pts[this._idx(r,   c  )];
      var p10=this.pts[this._idx(r,   c+1)];
      var p01=this.pts[this._idx(r+1, c  )];
      var p11=this.pts[this._idx(r+1, c+1)];
      drawTriTex(ctx,img, sx0,sy0, sx1,sy0, sx0,sy1, p00.x,p00.y, p10.x,p10.y, p01.x,p01.y);
      drawTriTex(ctx,img, sx1,sy0, sx1,sy1, sx0,sy1, p10.x,p10.y, p11.x,p11.y, p01.x,p01.y);
    }
  }
  ctx.restore();
};
MeshBody.prototype.reposition = function(cx, cy, dw, dh) {
  var dx=cx-this.cx, dy=cy-this.cy;
  this.cx=cx; this.cy=cy; this.dw=dw; this.dh=dh;
  this.x0=cx-dw/2; this.y0=cy-dh/2;
  for (var i=0; i<this.pts.length; i++) {
    var ri=Math.floor(i/(GCOLS+1)), ci=i%(GCOLS+1);
    var rx=this.x0+(ci/GCOLS)*dw, ry=this.y0+(ri/GROWS)*dh;
    this.rest[i].x=rx; this.rest[i].y=ry;
    this.pts[i].x+=dx; this.pts[i].y+=dy;
    this.pts[i].ox+=dx; this.pts[i].oy+=dy;
  }
};

/* ═══════════════════════════════════════════════════════════════════
   MOOD STATE MACHINE
═══════════════════════════════════════════════════════════════════ */

var MOODS    = ['sleeping','drowsy','awake','content','happy','ecstatic'];
var MOOD_IDX = {};
MOODS.forEach(function(s,i){ MOOD_IDX[s]=i; });

function MoodState() {
  this.mood='drowsy'; this.happiness=1;
  this._last=performance.now(); this._woken=false;
}
MoodState.prototype.interact = function(d) {
  this._last=performance.now();
  if (!this._woken) this._woken=true;
  this.happiness=Math.min(5, this.happiness+(d||1)*0.18);
  this._sync();
};
MoodState.prototype.update = function() {
  var idle=performance.now()-this._last;
  if (idle>2500)  this.happiness=Math.max(0, this.happiness-0.0018);
  if (idle>6000  && MOOD_IDX[this.mood]>=MOOD_IDX['awake']) this.mood='drowsy';
  if (idle>12000) this.mood='sleeping';
  this._sync();
};
MoodState.prototype._sync = function() {
  var h=this.happiness;
  if      (!this._woken)  this.mood='drowsy';
  else if (h<0.4)         { if (this.mood!=='sleeping') this.mood='drowsy'; }
  else if (h<1.4)         this.mood='awake';
  else if (h<2.4)         this.mood='content';
  else if (h<3.6)         this.mood='happy';
  else                    this.mood='ecstatic';
};
Object.defineProperty(MoodState.prototype,'idx',        {get:function(){ return MOOD_IDX[this.mood]||0; }});
Object.defineProperty(MoodState.prototype,'purrVol',    {get:function(){ return [0,0,0.12,0.38,0.68,1.0][this.idx]; }});
Object.defineProperty(MoodState.prototype,'breathRate', {get:function(){ return [0.38,0.48,0.54,0.60,0.76,1.02][this.idx]; }});
Object.defineProperty(MoodState.prototype,'spawnHearts',{get:function(){ return this.idx>=MOOD_IDX['content']; }});

/* ═══════════════════════════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════════════════════════ */

var _actx = null;
function getAC() { if (!_actx) _actx=new (window.AudioContext||window.webkitAudioContext)(); return _actx; }
function unlockAudio() { var c=getAC(); if (c.state==='suspended') c.resume(); }

function playBloop() {
  var c=getAC(), t=c.currentTime;
  var o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
  o.type='sine'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(78,t+0.22);
  f.type='lowpass'; f.frequency.value=380;
  g.gain.setValueAtTime(0.38,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.32);
}
function playMrrp() {
  var c=getAC(), t=c.currentTime;
  var o=c.createOscillator(), g=c.createGain();
  var lfo=c.createOscillator(), lg=c.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(580,t); o.frequency.exponentialRampToValueAtTime(380,t+0.16);
  lfo.frequency.value=20; lg.gain.value=14;
  lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t+0.16);
  g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.19);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.2);
}
function playTch() {
  var c=getAC(), t=c.currentTime;
  var sr=c.sampleRate, len=Math.floor(sr*0.032);
  var buf=c.createBuffer(1,len,sr), d=buf.getChannelData(0);
  for (var i=0;i<len;i++) d[i]=Math.random()*2-1;
  var src=c.createBufferSource(); src.buffer=buf;
  var f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=2200;
  var g=c.createGain(); g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
}
function playSwish(speed) {
  var c=getAC(), t=c.currentTime;
  var sr=c.sampleRate, len=Math.floor(sr*0.12);
  var buf=c.createBuffer(1,len,sr), d=buf.getChannelData(0), last=0;
  for (var i=0;i<len;i++) { last=(last+0.04*(Math.random()*2-1))/1.04; d[i]=last*4; }
  var src=c.createBufferSource(); src.buffer=buf;
  var f=c.createBiquadFilter(); f.type='bandpass';
  f.frequency.setValueAtTime(600+speed*8,t); f.frequency.linearRampToValueAtTime(300,t+0.12); f.Q.value=1.2;
  var g=c.createGain(); var vol=Math.min(0.18,speed*0.006);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
}

function PurringEngine() { this._on=false; this._master=null; this._vol=0; this._target=0; }
PurringEngine.prototype.start = function() {
  if (this._on) return; this._on=true;
  var c=getAC();
  var master=c.createGain(); master.gain.value=0; master.connect(c.destination);
  this._master=master;
  var freqs=[25,50,75,100], amps=[1.0,0.5,0.28,0.16];
  freqs.forEach(function(f,i){
    var o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.value=amps[i]*0.14;
    o.connect(g); g.connect(master); o.start();
  });
  var lfo=c.createOscillator(), lg=c.createGain();
  lfo.frequency.value=1.5; lg.gain.value=0.38;
  lfo.connect(lg); lg.connect(master.gain); lfo.start();
  var nlen=c.sampleRate*2, nb=c.createBuffer(1,nlen,c.sampleRate), nd=nb.getChannelData(0);
  for (var i=0;i<nlen;i++) nd[i]=Math.random()*2-1;
  var nl=c.createBufferSource(); nl.buffer=nb; nl.loop=true;
  var nf=c.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=700; nf.Q.value=0.9;
  var ng=c.createGain(); ng.gain.value=0.022;
  nl.connect(nf); nf.connect(ng); ng.connect(master); nl.start();
  var ab=c.createBuffer(1,nlen,c.sampleRate), ad=ab.getChannelData(0), lv=0;
  for (var j=0;j<nlen;j++) { lv=(lv+0.02*(Math.random()*2-1))/1.02; ad[j]=lv*3.5; }
  var al=c.createBufferSource(); al.buffer=ab; al.loop=true;
  var ag=c.createGain(); ag.gain.value=0.005;
  al.connect(ag); ag.connect(c.destination); al.start();
};
PurringEngine.prototype.setVol = function(v) { this._target=Math.max(0,Math.min(1,v)); };
PurringEngine.prototype.update = function(dt) {
  if (!this._master) return;
  this._vol+=(this._target-this._vol)*Math.min(1,dt*2.2);
  this._master.gain.value=this._vol*0.62;
};

/* ═══════════════════════════════════════════════════════════════════
   PARTICLE SYSTEM — hearts
═══════════════════════════════════════════════════════════════════ */

var HEART_COLORS = ['#ff7fa8','#ff9ec0','#ffb3c6','#ff6b9d','#ff85a1'];

function Particle() { this.alive=false; }
Particle.prototype.spawn = function(x, y) {
  this.x=x; this.y=y;
  this.vx=(Math.random()-0.5)*2.4; this.vy=-2.4-Math.random()*1.8;
  this.life=0; this.maxLife=1600+Math.random()*800;
  this.scale=0.45+Math.random()*0.65;
  this.rot=(Math.random()-0.5)*0.5;
  this.rotSpeed=(Math.random()-0.5)*0.04;
  this.color=HEART_COLORS[Math.floor(Math.random()*HEART_COLORS.length)];
  this.alive=true;
};

function Particles() { this._pool=Array.from({length:40},function(){ return new Particle(); }); }
Particles.prototype.emit = function(x, y) { var p=this._pool.find(function(p){ return !p.alive; }); if (p) p.spawn(x,y); };
Particles.prototype.update = function(dt) {
  for (var i=0;i<this._pool.length;i++) {
    var p=this._pool[i]; if (!p.alive) continue;
    p.life+=dt*1000;
    if (p.life>=p.maxLife) { p.alive=false; continue; }
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.014; p.vx*=0.99; p.rot+=p.rotSpeed;
  }
};
Particles.prototype.draw = function(ctx) {
  for (var i=0;i<this._pool.length;i++) {
    var p=this._pool[i]; if (!p.alive) continue;
    var t=p.life/p.maxLife;
    var alpha=t<0.12?t/0.12:t>0.7?1-(t-0.7)/0.3:1;
    var sc=p.scale*(1+Math.sin(t*Math.PI)*0.18);
    ctx.save();
    ctx.globalAlpha=alpha*0.92;
    ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.scale(sc,sc);
    ctx.beginPath();
    ctx.moveTo(0,-5); ctx.bezierCurveTo(-8,-15,-18,-5,0,6); ctx.bezierCurveTo(18,-5,8,-15,0,-5);
    ctx.closePath(); ctx.fillStyle=p.color; ctx.fill();
    ctx.globalAlpha=alpha*0.28;
    ctx.beginPath(); ctx.arc(-3,-7,3.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
    ctx.restore();
  }
};

/* ═══════════════════════════════════════════════════════════════════
   INPUT
═══════════════════════════════════════════════════════════════════ */

function Input(el) {
  this.down=false; this.x=0; this.y=0; this.px=0; this.py=0;
  this.onDown=null; this.onMove=null; this.onUp=null;
  el.style.touchAction='none';
  var self=this;
  el.addEventListener('pointerdown',   function(e){ self._dn(e,el); });
  el.addEventListener('pointermove',   function(e){ self._mv(e,el); });
  el.addEventListener('pointerup',     function(e){ self._up(e,el); });
  el.addEventListener('pointercancel', function(e){ self._up(e,el); });
}
Input.prototype._pos = function(e, el) {
  var r=el.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top];
};
Input.prototype._dn = function(e, el) {
  e.preventDefault(); el.setPointerCapture(e.pointerId);
  var pos=this._pos(e,el); this.px=this.x=pos[0]; this.py=this.y=pos[1]; this.down=true;
  if (this.onDown) this.onDown(pos[0],pos[1]);
};
Input.prototype._mv = function(e, el) {
  if (!this.down) return; e.preventDefault();
  var pos=this._pos(e,el); this.px=this.x; this.py=this.y; this.x=pos[0]; this.y=pos[1];
  if (this.onMove) this.onMove(pos[0],pos[1],pos[0]-this.px,pos[1]-this.py);
};
Input.prototype._up = function(e, el) { this.down=false; if (this.onUp) this.onUp(this.x,this.y); };

/* ═══════════════════════════════════════════════════════════════════
   WEBGL BLOOM
═══════════════════════════════════════════════════════════════════ */

function Bloom(canvas, src) {
  this._src=src; this._c=canvas; this._ok=false;
  var gl=canvas.getContext('webgl',{alpha:true, premultipliedAlpha:false});
  if (!gl) return;
  this._gl=gl;
  var V=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}`;
  var Fth=`precision mediump float;
uniform sampler2D t;varying vec2 v;
void main(){
  vec4 c=texture2D(t,vec2(v.x,1.-v.y));
  float b=dot(c.rgb,vec3(.2126,.7152,.0722));
  gl_FragColor=b>.32?c*.65:vec4(0.);
}`;
  var Fbl=`precision mediump float;
uniform sampler2D t;uniform vec2 res;varying vec2 v;
void main(){
  vec2 px=1./res; vec4 s=vec4(0.);
  float w[3]; w[0]=.25;w[1]=.5;w[2]=.25;
  for(int i=0;i<3;i++) for(int j=0;j<3;j++)
    s+=texture2D(t,v+vec2(float(i-1)*px.x,float(j-1)*px.y))*w[i]*w[j];
  gl_FragColor=s;
}`;
  var self=this;
  function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s; }
  function prog(vs,fs){ var p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); return p; }
  this._pTh=prog(V,Fth); this._pBl=prog(V,Fbl);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  this._srcTex=gl.createTexture(); this._fbo=gl.createFramebuffer(); this._fboTex=gl.createTexture();
  this._ok=true;
}
Bloom.prototype._tex = function(tex, img) {
  var gl=this._gl;
  gl.bindTexture(gl.TEXTURE_2D,tex);
  if (img) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
};
Bloom.prototype._draw = function(prog, tex, fbo) {
  var gl=this._gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.useProgram(prog);
  var pl=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(pl);
  gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.uniform1i(gl.getUniformLocation(prog,'t'),0);
  var rl=gl.getUniformLocation(prog,'res');
  if (rl) gl.uniform2f(rl,this._c.width,this._c.height);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
};
Bloom.prototype.resize = function(w, h) {
  if (!this._gl) return;
  var gl=this._gl;
  this._c.width=Math.max(1,Math.floor(w*0.38)); this._c.height=Math.max(1,Math.floor(h*0.38));
  this._tex(this._fboTex,null);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,this._c.width,this._c.height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,this._fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,this._fboTex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
};
Bloom.prototype.render = function() {
  if (!this._ok) return;
  var gl=this._gl;
  gl.viewport(0,0,this._c.width,this._c.height);
  try { this._tex(this._srcTex,this._src); } catch(e){ return; }
  this._draw(this._pTh, this._srcTex, this._fbo);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  this._draw(this._pBl, this._fboTex, null);
};

/* ═══════════════════════════════════════════════════════════════════
   DECORATIVE BACKGROUND — flowers & butterflies
═══════════════════════════════════════════════════════════════════ */

// Pre-seeded flower positions (as fractions of W/H, seeded for variety)
var FLOWER_DATA = [
  {fx:0.06, fy:0.18, r:9,  petals:5, color:'#f9b8d0'},
  {fx:0.92, fy:0.12, r:7,  petals:6, color:'#d4b8f9'},
  {fx:0.14, fy:0.55, r:6,  petals:5, color:'#f9d4b8'},
  {fx:0.88, fy:0.48, r:8,  petals:5, color:'#b8d4f9'},
  {fx:0.04, fy:0.80, r:7,  petals:6, color:'#f9e4b8'},
  {fx:0.95, fy:0.75, r:6,  petals:5, color:'#d4f9b8'},
  {fx:0.22, fy:0.08, r:5,  petals:6, color:'#f9b8f0'},
  {fx:0.78, fy:0.06, r:6,  petals:5, color:'#b8f9e0'},
  {fx:0.10, fy:0.35, r:5,  petals:5, color:'#f9c8c0'},
  {fx:0.90, fy:0.30, r:5,  petals:6, color:'#c8b8f9'},
  {fx:0.35, fy:0.92, r:6,  petals:5, color:'#f9d8e8'},
  {fx:0.65, fy:0.90, r:7,  petals:6, color:'#e8f9b8'},
];

function drawFlower(ctx, x, y, r, petals, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = color;
  for (var i=0; i<petals; i++) {
    var a = i/petals * Math.PI*2;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*r*0.65, Math.sin(a)*r*0.65, r*0.42, r*0.28, a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = '#fff7c0';
  ctx.beginPath(); ctx.arc(0,0, r*0.28, 0, Math.PI*2); ctx.fill();
  // Tiny center dot
  ctx.fillStyle = '#f0b040';
  ctx.beginPath(); ctx.arc(0,0, r*0.12, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function Butterfly(W, H) {
  this.baseX = (0.08 + Math.random()*0.84) * W;
  this.baseY = (0.08 + Math.random()*0.55) * H;
  this.phase = Math.random() * Math.PI*2;
  this.hSpeed = 0.00022 + Math.random()*0.00018;
  this.vSpeed = 0.00015 + Math.random()*0.00012;
  this.hAmp   = 35 + Math.random()*45;
  this.vAmp   = 18 + Math.random()*28;
  this.wingPh = Math.random() * Math.PI*2;
  this.wingSpd= 0.009 + Math.random()*0.005;
  var cols = ['#f9b8d8','#d4b8f9','#b8d8f9','#f9d8b8','#c8f9b8'];
  this.color  = cols[Math.floor(Math.random()*cols.length)];
  this.bodyColor = '#2a2820';
  this.size   = 0.7 + Math.random()*0.5;
  this.x = this.baseX; this.y = this.baseY;
}
Butterfly.prototype.update = function(ts) {
  this.x = this.baseX + Math.cos(ts*this.hSpeed + this.phase) * this.hAmp;
  this.y = this.baseY + Math.sin(ts*this.vSpeed + this.phase*0.7) * this.vAmp;
  this.wingPh += this.wingSpd * 60 * (1/60);
};
Butterfly.prototype.draw = function(ctx) {
  var wf = Math.abs(Math.sin(this.wingPh));
  var sz = this.size;
  ctx.save();
  ctx.translate(this.x, this.y);
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = this.color;
  // Each wing: upper lobe + lower lobe
  for (var s=-1; s<=1; s+=2) {
    // Upper wing
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(s*9*wf*sz,-13*sz, s*22*wf*sz,-9*sz, s*19*wf*sz,1*sz);
    ctx.bezierCurveTo(s*14*wf*sz,7*sz,  s*4*wf*sz, 4*sz,  0, 0);
    ctx.fill();
    // Lower wing
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(s*7*wf*sz, 5*sz, s*15*wf*sz,14*sz, s*11*wf*sz,18*sz);
    ctx.bezierCurveTo(s*6*wf*sz,20*sz, s*2*wf*sz, 11*sz, 0, 0);
    ctx.fill();
    // Wing shimmer
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(s*5*wf*sz,-8*sz, s*12*wf*sz,-5*sz, s*10*wf*sz,0);
    ctx.fill();
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.72;
  }
  // Body
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = this.bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, 4*sz, 1.2*sz, 7*sz, 0, 0, Math.PI*2);
  ctx.fill();
  // Antennae
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = this.bodyColor;
  ctx.lineWidth = 0.8;
  for (var a=-1; a<=1; a+=2) {
    ctx.beginPath();
    ctx.moveTo(a*1.5*sz, -3*sz);
    ctx.quadraticCurveTo(a*6*sz, -12*sz, a*4*sz, -16*sz);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(a*4*sz,-16*sz,1.2*sz,0,Math.PI*2);
    ctx.fillStyle=this.bodyColor; ctx.fill();
  }
  ctx.restore();
};

/* ═══════════════════════════════════════════════════════════════════
   MAIN — setup & game loop
═══════════════════════════════════════════════════════════════════ */

var mainCanvas  = document.getElementById('main-canvas');
var bloomCanvas = document.getElementById('bloom-canvas');
var ctx         = mainCanvas.getContext('2d');
var W=0, H=0, dpr=1;

// Offscreen canvas for scaled Pinxu image (performance)
var offImg = document.createElement('canvas');
var offCtx = offImg.getContext('2d');

var mesh   = null;
var bloom  = null;
var butterflies = [];

function resize() {
  dpr = window.devicePixelRatio||1;
  W   = window.innerWidth;
  H   = window.innerHeight;

  mainCanvas.width  = Math.round(W*dpr);
  mainCanvas.height = Math.round(H*dpr);
  mainCanvas.style.width  = W+'px';
  mainCanvas.style.height = H+'px';
  bloomCanvas.style.width  = W+'px';
  bloomCanvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if (bloom) bloom.resize(W,H);

  // Re-center mesh if already created
  if (mesh && offImg.width>0) {
    var cx=W*0.5, cy=H*0.50;
    var scale = Math.min(W*0.86/offImg.width, H*0.72/offImg.height);
    var dw=Math.round(offImg.width*scale), dh=Math.round(offImg.height*scale);
    mesh.reposition(cx, cy, dw, dh);
  }
}
window.addEventListener('resize', resize);

// Initialize bloom early (works without image)
bloom = new Bloom(bloomCanvas, mainCanvas);

// Image load then start
var pinxuImg = document.getElementById('pinxu-img');

function initWithImage() {
  var iw = pinxuImg.naturalWidth  || pinxuImg.width  || 512;
  var ih = pinxuImg.naturalHeight || pinxuImg.height || 512;

  resize(); // sets W, H

  // Scale image to display size
  var scale = Math.min(W*0.86/iw, H*0.72/ih);
  var dw = Math.round(iw*scale);
  var dh = Math.round(ih*scale);

  // Render to offscreen canvas at display resolution
  offImg.width  = dw;
  offImg.height = dh;
  offCtx.drawImage(pinxuImg, 0, 0, dw, dh);

  var cx = W*0.5, cy = H*0.50;
  mesh = new MeshBody(cx, cy, dw, dh);

  bloom.resize(W, H);

  // Create butterflies
  butterflies = [];
  for (var i=0; i<4; i++) butterflies.push(new Butterfly(W,H));

  startLoop();
}

if (pinxuImg.complete && pinxuImg.naturalWidth > 0) {
  initWithImage();
} else {
  pinxuImg.onload  = initWithImage;
  pinxuImg.onerror = function() {
    // Fallback: start without image
    console.warn('pinxu.png not found — mesh warping disabled');
    resize();
    bloom.resize(W,H);
    butterflies = [];
    for (var i=0; i<4; i++) butterflies.push(new Butterfly(W,H));
    startLoop();
  };
}

var particles  = new Particles();
var mood       = new MoodState();
var purr       = new PurringEngine();
var input      = new Input(mainCanvas);

var eyeTarget   = 0;
var audioOn     = false;
var swishCD     = 0;

function ensureAudio() { if (!audioOn) { unlockAudio(); purr.start(); audioOn=true; } }

// ── Input handlers ──
input.onDown = function(x, y) {
  ensureAudio();
  if (!mesh) return;
  var zone = mesh.getZone(x, y);
  if (zone !== 'outside') {
    mood.interact(zone==='head'?1.6:1);
    eyeTarget=1; setTimeout(function(){ eyeTarget=0; }, 900);
    hint.classList.remove('visible'); hintShown=true;
  }
  if (zone==='belly') {
    mesh.squishAt(x, y, mesh.dw*0.40, 10);
    playBloop();
    if (navigator.vibrate) navigator.vibrate(10);
    if (mood.spawnHearts) {
      var n = mood.idx>=5?5:3;
      for (var i=0;i<n;i++) particles.emit(x+(Math.random()-0.5)*50, y-15-Math.random()*20);
    }
  } else if (zone==='head') {
    mesh.squishAt(x, y, mesh.dw*0.28, 5);
  } else if (zone==='cheek') {
    mesh.squishAt(x, y, mesh.dw*0.24, 6);
    playMrrp();
    if (navigator.vibrate) navigator.vibrate(30);
  } else if (zone==='paws') {
    mesh.squishAt(x, y, mesh.dw*0.18, 3);
    playTch();
  }
};

input.onMove = function(x, y, dx, dy) {
  if (!input.down || !mesh) return;
  var zone = mesh.getZone(x, y);
  if (zone !== 'outside') {
    mood.interact(0.45);
    var spd = Math.hypot(dx, dy);
    mesh.squishAt(x, y, mesh.dw*0.30, spd*0.38);
    purr.setVol(mood.purrVol);
    if (swishCD<=0 && spd>3 && zone==='paws') {
      playSwish(spd); swishCD=140;
    }
  }
};
input.onUp = function() { purr.setVol(mood.purrVol*0.55); };

// ── Hint ──
var hint      = document.getElementById('hint');
var hintShown = false;
setTimeout(function(){
  if (!hintShown) { hint.classList.add('visible'); setTimeout(function(){ hint.classList.remove('visible'); },4500); }
}, 30000);

// ── Share ──
document.getElementById('share-btn').addEventListener('click', function(){
  if (navigator.share) navigator.share({title:'SquishPets',text:'Pinxu is the softest cat alive 🖤 squishpets.web/',url:location.href}).catch(function(){});
});

// ── Game loop ──
var lastT = performance.now();
var loopStarted = false;

function startLoop() {
  if (loopStarted) return;
  loopStarted = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function loop(ts) {
  var dt = Math.min((ts-lastT)/1000, 0.05);
  lastT = ts;

  mood.update();
  if (mesh) mesh.update();
  purr.setVol(mood.purrVol);
  purr.update(dt);
  particles.update(dt);
  swishCD -= dt*1000;

  // Update butterflies
  for (var i=0; i<butterflies.length; i++) butterflies[i].update(ts);

  // ── Draw ──
  ctx.clearRect(0,0,W,H);

  // Background gradient — shifts warmer with mood
  var mt = mood.idx/5;
  function lh(a,b,t) {
    var ar=parseInt(a.slice(1,3),16),ag=parseInt(a.slice(3,5),16),ab_=parseInt(a.slice(5,7),16);
    var br=parseInt(b.slice(1,3),16),bg=parseInt(b.slice(3,5),16),bb_=parseInt(b.slice(5,7),16);
    return '#'+Math.round(ar+(br-ar)*t).toString(16).padStart(2,'0')
              +Math.round(ag+(bg-ag)*t).toString(16).padStart(2,'0')
              +Math.round(ab_+(bb_-ab_)*t).toString(16).padStart(2,'0');
  }
  var bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,    lh('#f8eedf','#fae8e0',mt*0.6));
  bg.addColorStop(0.45, lh('#f0e2cc','#f0d8cc',mt*0.6));
  bg.addColorStop(1,    lh('#e4ceae','#e4c0ae',mt*0.6));
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Vignette
  var va = 0.18+mt*0.10;
  var vig = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.78);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(28,14,6,'+va.toFixed(2)+')');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

  // Flowers (background, static)
  for (var fi=0; fi<FLOWER_DATA.length; fi++) {
    var fd=FLOWER_DATA[fi];
    drawFlower(ctx, fd.fx*W, fd.fy*H, fd.r, fd.petals, fd.color);
  }

  // Butterflies behind cat
  for (var bi=0; bi<2; bi++) butterflies[bi].draw(ctx);

  // Parallax offset
  var plx=(input.x/W-0.5)*3.5, ply=(input.y/H-0.5)*2.5;
  ctx.save(); ctx.translate(plx,ply);

  // Breathing scale
  var breathPhase = ts*0.001*mood.breathRate*Math.PI*2;
  var breathScale = 1 + Math.sin(breathPhase)*0.015;

  // Pinxu image with mesh warping
  if (mesh && offImg.width>0) {
    mesh.draw(ctx, offImg, breathScale);
  }

  ctx.restore();

  // Particles
  particles.draw(ctx);

  // Butterflies in front of cat
  for (var bf=2; bf<butterflies.length; bf++) butterflies[bf].draw(ctx);

  bloom.render();

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
